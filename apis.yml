  evidence: >-
    Corrected 2026-09-10. The previous value (freemium / self-serve / try_now) was derived
    from a 2026-05-04 scaffold that invented a Free tier First Street has never published.
    firststreet.org/pricing is a lead-capture form with no tiers or prices; the docs state
    "Access to these APIs differ by contractual agreement" and route every enquiry to an
    account executive or bd@firststreet.org; rate limits and field-level entitlements are
    both bound to the key at issuance. There is no self-serve path from signup to a
    callable key, and the Playground requires a key you already hold.
