- aid: first-street:mcp
  name: First Street MCP Server
  description: >-
    Hosted, remote Model Context Protocol server exposing the Climate Risk API to agents
    over Streamable HTTP. Ten tools with real JSON Schema inputs — property lookup by
    address, coordinate or Place ID, building discovery inside a polygon, adaptation
    cost-benefit, locality macroeconomics, metadata, and an arbitrary GraphQL escape
    hatch. Authenticated with the same API key as the rest of the surface; tools/list is
    answerable anonymously.
