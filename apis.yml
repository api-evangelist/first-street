aid: first-street
name: First Street
description: >-
  First Street is the physical climate risk data and analytics company behind the Risk
  Factor property reports, acquired by MSCI on 2026-08-03. It models flood, wildfire,
  wind, heat, cold, drought and air quality at property level anywhere on Earth using
  peer-reviewed, physics-based methods rather than historical claims data, and exposes
  that model through three APIs: a global Climate Risk GraphQL API, an Enterprise GraphQL
  API for portfolio-level exposure, scenario analysis and adaptation cost-benefit, and a
  Raster Map tile API for visualising perils on a map. It also runs a hosted MCP server so
  agents can query property climate risk directly. Access to every surface, and to
  individual fields within the GraphQL schemas, is granted by contract.
type: Index
