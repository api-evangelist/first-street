method: searched
source: https://github.com/FirstStreet/api/commits
description: >-
  First Street publishes no changelog page and no release-notes feed on its docs site. It
  does, however, version its GraphQL schemas in a public GitHub repository, and those
  commits are a real, dated, first-party record of what changed in the contract. That
  repository is the changelog First Street actually has.
finding: >-
  There is no documented deprecation notice period and no changelog on docs.firststreet.org
  — an integrator learns that a peril was added or a field deprecated by diffing
  schema.graphql. A dated changelog page is the single cheapest operational-transparency
  fix available to this provider.

