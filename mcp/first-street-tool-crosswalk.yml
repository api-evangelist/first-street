graphql_only:
  - field: climate-risk:Query.localitiesByInsuranceConnection
    reason: Insurance-impact locality search has no dedicated MCP tool.
  - field: climate-risk:Query.version
    reason: Schema/vintage version probe has no dedicated MCP tool.

rest_only:
  - operation: getRasterTile
    api: First Street Raster Map API
    reason: >-
      No MCP tool exposes map tiles. A PNG tile is not a useful MCP result shape, and the
      docs scope the MCP server to the Climate Risk API.
  - operation: enterpriseGraphql
    api: First Street Enterprise API
    reason: >-
      The whole Enterprise surface (25 queries, 42 mutations) is outside the MCP server.
      Docs say expansion is planned "in the near future".

