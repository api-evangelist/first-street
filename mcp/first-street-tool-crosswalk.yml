source: >-
  mcp/first-street-mcp-tools.json (anonymous tools/list, HTTP 200),
  graphql/first-street-climate-risk-api.graphql (first-party SDL published at
  github.com/FirstStreet/api), openapi/*-openapi.yml
description: >-
  Binds each First Street MCP tool to the surface that actually backs it. The important
  finding here is a shape mismatch, not a gap: First Street's REST surface is a single
  GraphQL passthrough endpoint per API plus a tile endpoint, so almost every MCP tool
  binds to a GraphQL FIELD rather than to a REST operationId. Mapping tools only against
  the OpenAPI would report 9 of 10 tools as unbacked, which would be wrong.

surfaces:
  openapi:
    files:
      - openapi/first-street-graphql-api-openapi.yml
      - openapi/first-street-enterprise-api-openapi.yml
      - openapi/first-street-maps-api-openapi.yml
    operations: 3
    note: >-
      The REST surface is thin by design — two GraphQL transport endpoints and one raster
      tile endpoint. It is not a resource-per-path REST API.
  graphql:
    - name: climate-risk
      endpoint: https://api.firststreet.org/v3/graphql
      sdl: graphql/first-street-climate-risk-api.graphql
      introspection: gated
      introspection_note: 'POST {__schema{queryType{name}}} returned HTTP 401 Invalid API Key'
      query_fields: 11
      mutation_fields: 0
    - name: enterprise
      endpoint: https://api.firststreet.org/enterprise/graphql
      sdl: graphql/first-street-enterprise-api.graphql
      introspection: open
      introspection_note: >-
        Full introspection answered anonymously, HTTP 200, 350 types. Saved to
        graphql/first-street-enterprise-introspection.json. Data queries still 401.
      query_fields: 25
      mutation_fields: 42
  mcp:
    url: https://mcp.firststreet.org/mcp
    tools_list: open
    tools_list_note: 'tools/list answered anonymously, HTTP 200, real inputSchema per tool'
    tool_count: 10
    scope: Climate Risk API only

