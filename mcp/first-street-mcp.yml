source: https://docs.firststreet.org/api/mcp/getting-started
description: 'First Street publishes a hosted, remote MCP server that exposes the Climate Risk API (property-level
  physical climate risk: flood, wildfire, wind, heat, cold, drought) to agents over Streamable HTTP. The
  docs page names the endpoint and the tool set; the live server answered an anonymous tools/list with
  the real inputSchema for every tool.'
deployment:
  mode: remote
  endpoint: https://mcp.firststreet.org/mcp
  install: null
  package: null
  auth: api-key
  verified: probed
  probe_prior: (never probed)
  probe: live
  probe_why: live
  checked: '2026-09-11'
  source: claimed-backlog re-probe 2026-09-11
server:
  name: firststreet
  transport: http
  transport_note: 'Docs say "Streamable HTTP transports"; the endpoint answered a JSON-RPC POST with Accept:
    application/json, text/event-stream and replied as text/event-stream.'
  url: https://mcp.firststreet.org/mcp
  auth:
    scheme: bearer
    header: Authorization
    value: Bearer <your-api-key>
    note: Same API key as the REST/GraphQL surface. Access is gated by the same contractual entitlement
      as the Climate Risk API — "All API users with access to the Climate Risk API is able utilize First
      Street's MCP Service."
  client_config: "{\n  \"mcpServers\": {\n    \"firststreet\": {\n      \"transport\": \"http\",\n   \
    \   \"url\": \"https://mcp.firststreet.org/mcp\",\n      \"headers\": { \"Authorization\": \"Bearer\
    \ <your-token>\" }\n    }\n  }\n}\n"
