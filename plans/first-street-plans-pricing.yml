description: >-
  First Street publishes NO API plans, prices, quotas or tiers. This file replaces the
  2026-05-04 scaffold, which invented a Free / Professional / Enterprise ladder with
  1,000- and 100,000-request quotas that First Street has never published. The real
  commercial model is contract-only, and the docs say so repeatedly and explicitly.
plan_count: 0
plans: []

pricing_page:
  url: https://firststreet.org/pricing
  http_status: 200
  verdict: lead-capture
  finding: >-
    The page fetched live on 2026-09-10 carries an Enterprise Suite pitch and a contact
    form ("By submitting our information you agree to the Terms of Use and Privacy
    Policy"). It contains no tier names, no price points, no quotas and no overage rates.
    The only commercial string on it is "Contact Sales to unlock".

evidence:
  - source: https://docs.firststreet.org/api/available-api/graphql-apis
    quote: >-
      "Access to these APIs differ by contractual agreement. For access information or any
      issues, please contact your account executive, or email bd@firststreet.org."
  - source: https://docs.firststreet.org/api/available-api/map-apis
    quote: >-
      "Access to this API and features differ by contractual agreement."
  - source: https://docs.firststreet.org/api/climate-risk-api/getting-started/rate-limits
    quote: >-
      "Default request limiting starts at 150 requests per minute but is adjusted based on
      individual contract agreements."
  - source: https://docs.firststreet.org/api
    quote: >-
      "Request for more information on how you can integrate the First Street Global API
      within your solution" — the Access Information section links to the pricing page
      rather than stating a price.
  - source: https://github.com/FirstStreet/api/blob/HEAD/README.md
    quote: 'For access information and partnerships, please contact api@firststreet.org.'

entitlement_note: >-
  Pricing is not the only thing set by contract. Field-level access inside the GraphQL
  schema is contractual too — an account can hold a working key and still be denied an
  individual node (errors/ "Error 15"). There is no self-serve path from signup to a
  callable key.

no_free_tier: true
no_trial: true
self_serve: false
contact:
  sales: bd@firststreet.org
  api: api@firststreet.org

maintainers:
