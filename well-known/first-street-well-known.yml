findings:
  - >-
    No security.txt anywhere, despite First Street publishing a full vulnerability
    disclosure policy with a safe harbour clause at
    https://docs.firststreet.org/api/security and a security@firststreet.org contact. A
    single RFC 9116 file on firststreet.org would make that policy machine-discoverable.
  - >-
    No A2A agent card at either /.well-known/agent-card.json or the legacy
    /.well-known/agent.json on any of the nine hosts — including mcp.firststreet.org,
    which does run a real MCP server.
  - >-
    No apis.json / apis.yml index at either the root or the well-known path.
  - >-
    No OAuth or OIDC discovery document; the API is API-key only and enterprise SSO is
    SAML 2.0, whose metadata is served at a non-well-known path
    (https://auth.firststreet.org/sso/saml/metadata) and is captured in conformance/.

