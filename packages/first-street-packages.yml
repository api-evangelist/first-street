generated: '2026-09-10'
method: searched
source: >-
  registry.npmjs.org, pypi.org, proxy.golang.org, and the FirstStreet GitHub organization
description: >-
  First Street has published three first-party client libraries — JavaScript, Python and
  Go. All three are ARCHIVED on GitHub and all three target the retired v2 US-domestic
  "First Street Foundation API". The newest release across the whole set is 2021-06-17;
  the current product is the v3/v4 global GraphQL Climate Risk API and the Enterprise API,
  neither of which has a maintained SDK. A consumer integrating today writes their own
  GraphQL client, or uses the MCP server.
finding: >-
  Every published First Street SDK predates the API it would have to call by roughly five
  years. This is the strongest decay signal in the record and it is provider-published and
  reliably dated.
official_package_count: 3
maintained_package_count: 0

